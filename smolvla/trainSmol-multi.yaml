# Multi-GPU smoke test on h100 nodepool (p5.48xlarge, 8× H100 80GB).
# All other multi-GPU pools (gpul/a100-40/a100-80/g548xlarge) had no
# AWS on-demand capacity in us-east-1b at smoke time. h100 = last try.
# We request 4 of 8 H100s; H100 80GB has tons of headroom for SmolVLA
# at batch_size=64.
# For the real-run version (steps=60000), see trainSmol-multi-real.yaml.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: smolvla-finetune-multi
  namespace: humanoid
spec:
  runtimeRef:
    name: torch-distributed
  trainer:
    image: 916780037007.dkr.ecr.us-east-1.amazonaws.com/ethroboticsclub/pytorch:sha-d866de5
    command:
      - /bin/bash
      - -c
      - |
        export NUM_GPUS=4 BATCH_SIZE_PER_GPU=64 STEPS=100 SAVE_FREQ=20 LOG_FREQ=20
        curl https://raw.githubusercontent.com/ETHRoboticsClub/Hydra/refs/heads/testLuca/smolvla/run-multi.sh -o /tmp/run.sh && bash /tmp/run.sh
    numNodes: 1
    resourcesPerNode:
      requests:
        nvidia.com/gpu: "4"
        cpu: "40"
        memory: "320Gi"
      limits:
        nvidia.com/gpu: "4"
        cpu: "40"
        memory: "320Gi"
  podTemplateOverrides:
    - targetJobs:
        - name: node
      spec:
        serviceAccountName: training-sa
        nodeSelector:
          karpenter.sh/nodepool: h100
          node-tier: h100
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: smolvla-data
          - name: checkpoints
            persistentVolumeClaim:
              claimName: smolvla-checkpoints
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          - name: hf-token
            secret:
              secretName: hf-token
        containers:
          - name: node
            volumeMounts:
              - name: data
                mountPath: /data
              - name: checkpoints
                mountPath: /checkpoints
              - name: dshm
                mountPath: /dev/shm
              - name: hf-token
                mountPath: /secrets/hf
                readOnly: true
