apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smolvla-data
  namespace: humanoid
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smolvla-checkpoints
  namespace: humanoid
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 80Gi
