# Cosmos-Predict2 LIBERO LoRA fine-tuning
# Variables in {{BRACKETS}} are substituted by launch-new
#
# Launch with:
#   IMAGE_OVERRIDE=nvcr.io/nvidia/pytorch:24.12-py3 \
#   DATA_PVC=cosmos-libero \
#   ./launch-new a100-80 cosmos-predict2/libero
#
# Env vars (pass via env before launch-new, picked up by entrypoint.sh):
#   SMOKETEST=1   — 50-iter sanity check (~$2-5)
#   NPROC         — number of GPUs for torchrun (default: auto-detect)
#   WANDB_API_KEY — injected from wandb-secret automatically

apiVersion: batch/v1
kind: Job
metadata:
  name: {{JOB_NAME}}
  namespace: {{NAMESPACE}}
  labels:
    app: {{JOB_NAME}}
    ethrobotics.ch/managed-by: launch
    ethrobotics.ch/job-name: {{JOB_NAME}}
    ethrobotics.ch/profile: {{PROFILE}}
    ethrobotics.ch/launcher-hash: {{LAUNCHER_HASH}}
  annotations:
    ethrobotics.ch/launcher: '{{LAUNCHER_ID}}'
    ethrobotics.ch/user: '{{USER}}'
spec:
  template:
    metadata:
      labels:
        app: {{JOB_NAME}}
        ethrobotics.ch/job-name: {{JOB_NAME}}
      annotations:
        ethrobotics.ch/launcher: '{{LAUNCHER_ID}}'
        ethrobotics.ch/user: '{{USER}}'
    spec:
      serviceAccountName: {{SERVICE_ACCOUNT}}
      nodeSelector:
        karpenter.sh/nodepool: {{NODEPOOL}}
        node-tier: {{NODETIER}}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      restartPolicy: Never
      initContainers:
        - name: init
          image: {{INIT_IMAGE}}
          command: ["/bin/bash", "-c"]
          args:
            - |
{{INIT_SCRIPT}}
          resources:
            requests:
              cpu: "{{CPU_REQUEST}}"
              memory: "{{MEM_REQUEST}}"
              nvidia.com/gpu: "{{GPU_REQUEST}}"
            limits:
              cpu: "{{CPU_BUFFER_LIMIT}}"
              memory: "{{MEM_BUFFER_LIMIT}}"
              nvidia.com/gpu: "{{GPU_LIMIT}}"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: data
              mountPath: /data
            - name: job-files
              mountPath: /job-files
              readOnly: true
      containers:
        - name: main
          image: {{IMAGE}}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euxo pipefail
              export WANDB_API_KEY="$(cat /var/run/secrets/wandb/WANDB_API_KEY 2>/dev/null || echo '')"
              export HF_TOKEN="$(cat /var/run/secrets/hf/HF_TOKEN 2>/dev/null || echo '')"
              cd /workspace && ./entrypoint.sh
          resources:
            requests:
              cpu: "{{CPU_REQUEST}}"
              memory: "{{MEM_REQUEST}}"
              nvidia.com/gpu: "{{GPU_REQUEST}}"
            limits:
              cpu: "{{CPU_BUFFER_LIMIT}}"
              memory: "{{MEM_BUFFER_LIMIT}}"
              nvidia.com/gpu: "{{GPU_LIMIT}}"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
            - name: wandb-secret
              mountPath: /var/run/secrets/wandb
              readOnly: true
            - name: hf-secret
              mountPath: /var/run/secrets/hf
              readOnly: true
      volumes:
        - name: workspace
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: {{DATA_PVC}}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{SHM_SIZE}}
        - name: wandb-secret
          secret:
            secretName: wandb-secret
        - name: hf-secret
          secret:
            secretName: hf-secret
        - name: job-files
          configMap:
            name: {{CONFIGMAP_NAME}}
            defaultMode: 0755
