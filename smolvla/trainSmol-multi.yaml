# Multi-GPU smoke test: 4× L40S on g6e.48xlarge (gpul nodepool).
# Same params as the single-GPU smoke (steps=100, save_freq=20) but with
# batch_size=64 per GPU → effective batch = 256 (4× the single-GPU smoke).
# For the real-run version (steps=60000), see trainSmol-multi-real.yaml.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: smolvla-finetune-multi
  namespace: humanoid
spec:
  runtimeRef:
    name: torch-distributed
  trainer:
    image: 916780037007.dkr.ecr.us-east-1.amazonaws.com/ethroboticsclub/pytorch:sha-d866de5
    command:
      - /bin/bash
      - -c
      - |
        export NUM_GPUS=4 BATCH_SIZE_PER_GPU=64 STEPS=100 SAVE_FREQ=20 LOG_FREQ=20
        curl https://raw.githubusercontent.com/ETHRoboticsClub/Hydra/refs/heads/testLuca/smolvla/run-multi.sh -o /tmp/run.sh && bash /tmp/run.sh
    numNodes: 1
    resourcesPerNode:
      requests:
        nvidia.com/gpu: "4"
        cpu: "40"
        memory: "320Gi"
      limits:
        nvidia.com/gpu: "4"
        cpu: "40"
        memory: "320Gi"
  podTemplateOverrides:
    - targetJobs:
        - name: node
      spec:
        serviceAccountName: training-sa
        nodeSelector:
          karpenter.sh/nodepool: gpul
          node-tier: gpul
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: smolvla-data
          - name: checkpoints
            persistentVolumeClaim:
              claimName: smolvla-checkpoints
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          - name: hf-token
            secret:
              secretName: hf-token
        containers:
          - name: node
            volumeMounts:
              - name: data
                mountPath: /data
              - name: checkpoints
                mountPath: /checkpoints
              - name: dshm
                mountPath: /dev/shm
              - name: hf-token
                mountPath: /secrets/hf
                readOnly: true
