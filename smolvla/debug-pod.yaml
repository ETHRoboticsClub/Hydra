apiVersion: v1
kind: Pod
metadata:
  name: smolvla-debug
  namespace: humanoid
spec:
  serviceAccountName: training-sa
  nodeSelector:
    karpenter.sh/nodepool: gpus
    node-tier: gpus
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  restartPolicy: Never
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: smolvla-data
    - name: hf-token
      secret:
        secretName: hf-token
  containers:
    - name: debug
      image: 916780037007.dkr.ecr.us-east-1.amazonaws.com/ethroboticsclub/pytorch:sha-d866de5
      command: ["sleep", "infinity"]
      resources:
        requests: { cpu: "2", memory: "4Gi" }
        limits:   { cpu: "2", memory: "4Gi" }
      volumeMounts:
        - { name: data, mountPath: /data }
        - { name: hf-token, mountPath: /secrets/hf, readOnly: true }
